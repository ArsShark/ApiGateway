spring:
  application:
    name: api-gateway
  profiles:
    default: local
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            # Never wait for a service for ever: 2 seconds to connect, 10 seconds for the answer.
            connect-timeout: 2000
            response-timeout: 10s

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt-issuer: ${JWT_ISSUER:authentication-service}
